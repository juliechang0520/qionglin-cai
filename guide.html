<h1>拍匾額聽故事・匾額與彩繪導覽｜金門瓊林蔡氏</h1>
<p>到瓊林宗祠現場用：12 面匾額的人物故事、八座祠堂 91 面匾額清冊，以及家廟彩繪尋寶 20 組（含科舉暗號圖案）。</p>
<h2>匾額故事</h2>
<ul>
<li>「進士」（進士匾・蔡守愚・1586）：父親抗倭戰死，他考上全國前段的進士，後來官至布政使。蔡守愚號發吾，是新倉下二房族長蔡希旦的兒子。明嘉靖年間倭寇攻打金門，父親率鄉勇抵抗，最後戰死。</li>
<li>「進士」（進士匾・蔡貴易・1568）：「父子文宗」的父親，倭寇之亂後考上進士。蔡貴易生於 1538 年，字爾通，號肖兼。名士屠隆寫信給他時尊稱他「使君」，這是對地方長官的稱呼。</li>
<li>「進士」（進士匾・蔡獻臣・1589）：學問純正、名重一時，「瓊林」這個村名就和他有關。蔡獻臣號虛臺，是蔡貴易的兒子。他做過禮部的官，跟顧憲成論學，湯顯祖、鄒元標都寫信給他。</li>
<li>「進士」（進士匾・蔡廷蘭・1845）：祖籍瓊林、生在澎湖，遇颱風漂流到越南，寫成一本被翻成多國文字的書。蔡廷蘭（1801–1859）祖籍金門瓊林、生於澎湖，是澎湖唯一的進士，人稱「開澎進士」。</li>
<li>「提督軍門」（武職匾・蔡攀龍・1787）：原本是窮漁夫，後來成為提督，畫像掛進北京紫光閣。蔡攀龍（1738–1798）原本是貧窮的漁夫，岳父看他力氣大，推薦他從軍，結果一路升遷。</li>
<li>「進士」（進士匾・蔡國光・1634）：明朝最後一批進士之一，經歷改朝換代，晚年替逃難後重修的族譜寫序。蔡國光號賁服，1634 年（崇禎七年）中進士，十年後明朝就滅亡了。1663 年清兵遷界、族人死亡逃散過半，1672 年族人蔡其僴帶著逃難時保住的族譜重修，由他寫序。</li>
<li>「進士」（進士匾・蔡懋賢・1589）：考上進士、匾掛在祠堂，神主卻不能進大宗。蔡懋賢是外甥過繼給舅舅，並非蔡家血統。瓊林蔡氏堅守血緣原則，就算他做了官，神主也不能入祀大宗家廟。</li>
<li>「副魁」（副榜匾・蔡大壯（雉胎）・1642）：明朝滅亡前兩年考上副榜，祖孫三代都有功名。蔡大壯字允輿，號雉胎。祖父是進士蔡獻臣，父親蔡甘光是天啟元年的恩貢生。崇禎十五年（1642）他參加福建鄉試，考上副榜。</li>
<li>「祖孫父子兄弟叔姪登科」（登科匾・蔡宗德一家六人・1531（匾上紀年））：匾上寫著 1531 年，卻列了 1642 年才考上的人。這塊匾到底是什麼時候做的？這塊匾不是說六個人同一年考上，而是把一家五代的功名寫在一起：祖父蔡宗德是 1531 年舉人，兒子蔡貴易、孫子蔡獻臣先後中進士，獻臣的兩個兒子蔡甘光、蔡龢是貢生，獻臣的孫子蔡大壯 1642 年考上副榜。祖孫、父子、兄弟、叔姪四種關係都出了讀書人，所以叫「祖孫父子兄弟叔姪登科」。</li>
<li>「御賜里名瓊林」（御賜匾・明朝皇帝・明末（待考））：這塊匾解釋了「瓊林」這個名字是怎麼來的。明朝末年，「平林」獲賜名「瓊林」，從此沿用到今天。賜名的年代有天啟、崇禎兩種說法。</li>
<li>「父子文宗」（榮譽匾・蔡貴易・蔡獻臣・明代）：爸爸考上進士，兒子也考上，這一房就把它當成燈號。蔡貴易 1568 年中進士，兒子蔡獻臣 1589 年也中進士，父子都是當時的文壇人物。</li>
<li>「忠孝廉節」（家訓匾・全族・待考）：四個字，就是瓊林蔡氏的家規。大宗家廟正廳的四個大字，相傳仿朱熹筆意。</li>
</ul>
<h2>各祠匾額清冊（2014 年彩繪調查）</h2>
<ul>
<li>蔡氏家廟（大宗）（26 面）：蔡氏家廟、文魁、文魁、副魁、文魁、副魁、文魁、副魁、文魁、進士、進士、進士、進士、文魁、祖孫父子兄弟伯姪登科、文魁、祖孫父子兄弟叔姪登科、兄弟明經、威震將軍、將軍、公正可風、外翰、進士、鄉賢名宦、進士、貢元</li>
<li>十一世榮生公宗祠（新倉上二房）（13 面）：十一世宗祠、祖德流芳、文魁、文魁、祖孫父子兄弟叔侄登科、父子文宗、考試委員、兄弟明經、進士、鄉賢名宦、進士、副魁、臨在上</li>
<li>六世樂圃公宗祠（18 面）：六世宗祠、文魁、進士、進士、文魁、文魁、文魁、副魁、文魁、文魁、盛世儒英、文魁、拔元、兄弟明經、進士、御賜里名瓊林、進士、兄弟文魁</li>
<li>十世廷輔公宗祠（8 面）：左參政、右侍郎、祖孫父子兄弟叔侄登科、忠烈、三藩總憲、鄉賢名宦、兩世文宗、孝節</li>
<li>十世柏崖公宗祠（13 面）：十世宗祠、恩元、文魁、文魁、副魁、祖孫父子兄弟伯姪登科、畫像功臣、隸萼春風、副魁、外翰、進士、進士、貢元</li>
<li>十六世藩伯宗祠（9 面）：藩伯宗祠、文魁、副魁、三藩總憲、盛世儒英、進士、鄉賢名宦、進士、聲重雪山</li>
<li>六世竹溪公宗祠（2 面）：祖德流芳、提督軍門</li>
<li>六世前庭房宗祠（2 面）：進士、祖德流芳</li>
</ul>
<h2>家廟彩繪尋寶</h2>
<ul>
<li>蕭何月下追韓信（三川殿・三川殿第二棟架的通樑）：韓信覺得不受重用，連夜出走，蕭何追回他並推薦給劉邦拜為大將。講的是識才、惜才。</li>
<li>千里走單騎（三川殿・三川殿第五棟架的通樑（正廳第一棟架也有一幅））：關羽辭別曹操，一路過關去找劉備。講的是忠義。</li>
<li>二十四孝四連幅（三川殿・三川殿第三檁木面的門楣，一長條）：行傭供母、鹿乳奉親、搤虎救父、單衣順母。一進門先看到的就是「孝」。</li>
<li>一甲一名（三川殿・三川殿屋頂的脊堵，還有第二棟架的束仔）：螃蟹有硬殼，殼就是「甲」。一隻蟹＝一甲一名，也就是狀元。</li>
<li>二甲傳臚（三川殿・三川殿第六棟架的束仔）：兩隻蟹是「二甲」，蘆和「臚」同音。二甲第一名叫傳臚，殿試放榜時由衛士高聲傳呼名字。瓊林好幾位進士都考在二甲，這個願望很實在。</li>
<li>金玉滿堂（三川殿・三川殿第六棟架的束仔（和二甲傳臚相鄰））：金魚諧音「金玉」，一缸金魚就是金玉滿堂。</li>
<li>年年有餘、彎彎順（三川殿・三川殿第一棟架的束仔，兩幅並排）：魚諧音「餘」；蝦身能彎能跳，寓意事事順利、時來運轉。</li>
<li>四種果子（三川殿・三川殿第二、第五棟架的雀替）：南瓜藤長籽多、石榴千子同膜，都是多子多孫；佛手諧音「福」；桃子是壽。</li>
<li>鼠鬧金瓜（三川殿・三川殿第二檁木面的雀替，左右各一）：瓜藤綿長、結籽多，老鼠也多產，合起來是子孫綿延。</li>
<li>二虎遊林（三川殿・三川殿第四棟架的束隨）：虎能驅邪。三川殿常是左龍右虎，也有出將入相的意思。</li>
<li>麒麟（三川殿・三川殿第二、第五棟架的斗座，一共四隻）：麒麟是仁獸，也比喻才俊之士；清代一品武官的補服就繡麒麟。</li>
<li>帶子上朝（三川殿・三川殿第三棟架的束隨）：原指孔子後代世襲官位、可帶兒子上朝，後來比喻父子都做大官。瓊林就有蔡貴易、蔡獻臣父子進士。</li>
<li>加官進祿（三川殿・三川殿第三檁木面的側門門板，以及中門上的兩顆門印「加冠」「進爵」）：冠諧音「官」，鹿諧音「祿」：升官又加薪。</li>
<li>蘇武牧羊、梅妻鶴子（正廳・正廳第二棟架的通樑，兩幅在同一根樑上）：蘇武被匈奴扣留牧羊十九年仍不投降，代表「節」；文人與鶴這幅，報告引宋代趙抃出巡只帶一琴一鶴的故事，代表「廉」。</li>
<li>神龕上的三個孝子（正廳・正廳神龕的裙板）：孝感動天（舜）、棄官尋母（潘岳）、望雲思親（狄仁傑）。祖先神主前面再提醒一次孝。</li>
<li>郭子儀拜壽（正廳・正廳第十二檁的門楣）：唐朝名將郭子儀七子八婿都做官，比喻家族興旺、子孝父榮。</li>
<li>三思品蓮（正廳・正廳第十一檁的雀替）：蓮諧音「連」，蓮子諧音「科」，合起來是連續考中。</li>
<li>大象與獅子（正廳・正廳第一、第二棟架的斗座，左右各一象一獅）：象諧音「相」，代表文官宰相；獅子是二品武官的補服圖案。一文一武，正好是瓊林「文武世家」。</li>
<li>逐祿（正廳・正廳第二棟架的看隨）：竹諧音「逐」，鹿諧音「祿」：追求功名利祿。</li>
<li>螭龍團爐（正廳・正廳祖先龕的裙板和格心，十幾面）：螭龍是家廟裡數量最多的題材，象徵權力，也因線條柔美常被簡化成紋飾。數數看祖先龕上有幾面。</li>
</ul>
