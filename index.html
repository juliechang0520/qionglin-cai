<h1>金門瓊林蔡氏｜七座八祠・宗祠、族譜與祭祖</h1>
<p>金門瓊林蔡氏的源流、族譜、七座八祠（國定古蹟）、宗祠建築、科舉人物、戰地歲月與春秋二祭。瓊林是金門最大的傳統聚落，明清出了六位進士。</p>
<h2>簡介</h2>
<ul>
<li>從平林到瓊林，一個家族在金門島中央生活了近千年。</li>
<li>瓊林位於金門島中央的金湖鎮，是蔡氏單姓聚落，有「七座八祠」國定古蹟，明清兩代出了六位進士，燈號「文武世家」。</li>
</ul>
<h2>一年中的祭典</h2>
<ul>
<li>農曆二月初七　春祭：靜山公忌日，大宗家廟行大三獻。</li>
<li>清明前一日　墓祭：全族上太武山祭五世祖墓。</li>
<li>農曆十月初六　秋祭：靜山公夫人顏氏忌日。</li>
<li>冬至　拜圓：各房帶湯圓到宗祠祭祖。</li>
<li>除夕　豬肝墓：祭二世祖，祭品要有豬肝。</li>
</ul>
<h2>參訪資訊</h2>
<ul>
<li>宗祠群：位於金湖鎮瓊林里，宗祠常年開放參觀，是金門少數對外開放的宗祠。逢農曆二月初七、十月初六可以看到古禮祭祖。</li>
<li>瓊林戰鬥坑道：1976 年建成，全長 1,355 公尺，是金門最長的防禦坑道，有 12 個出入口，串連村中各重要據點。</li>
<li>瓊林民防館：原是農會的農藥肥料銷售處，戰地政務解除後交還瓊林十七郎公裔孫基金會管理，現在展示民防歷史。</li>
<li>風獅爺巡禮：北風獅（193 公分）、南風獅（114 公分）都是縣定古蹟；家廟後牆的小風獅是熱門打卡點。</li>
<li>導覽行程：金門觀光網列有「瓊林日間導覽」，約兩小時，週末下午舉辦，暑假每天都有。出發前請先上官網確認最新時間。</li>
<li>交通與位置：瓊林在金門島正中央，夾在環島北路與伯玉路之間，是古代官道的要衝，從金城或山外過來都很方便。</li>
</ul>
<h2>最新公告</h2>
<ul>
<li>2026-11-07　「秋慶盛典－瓊林．聚落之森」（已結束）：11/7–11/8 於瓊林苑及木棉花磚牆旁舉辦，內容有手作市集、在地居民帶領的聚落走讀、講座、草地音樂與露天電影。</li>
</ul>
